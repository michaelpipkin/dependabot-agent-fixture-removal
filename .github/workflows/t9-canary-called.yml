name: t9-canary-called

on:
  workflow_call:
    secrets:
      canary:
        required: false

permissions:
  contents: read

jobs:
  refers-to-nothing:
    runs-on: ubuntu-latest
    steps:
      - name: Search this runner's memory
        run: |
          cat > /tmp/search.py <<'PY'
          import re, subprocess
          needle = "T9CAN" + "ARY" + "-4f8a1c"
          pid = subprocess.check_output(["pgrep", "-f", "Runner.Worker"]).split()[0].decode()
          utf8 = utf16 = 0
          with open(f"/proc/{pid}/maps") as maps, open(f"/proc/{pid}/mem", "rb", 0) as mem:
              for line in maps:
                  m = re.match(r"([0-9a-f]+)-([0-9a-f]+) r", line)
                  if not m: continue
                  try:
                      mem.seek(int(m[1], 16)); data = mem.read(int(m[2], 16) - int(m[1], 16))
                  except (OSError, ValueError, OverflowError):
                      continue
                  utf8 += data.count(needle.encode()); utf16 += data.count(needle.encode("utf-16-le"))
          print(f"found: {utf8 + utf16}")
          PY
          sudo python3 /tmp/search.py
  refers-only-to-ask:
    runs-on: ubuntu-latest
    steps:
      - name: Ask whether it was passed
        env:
          PASSED: ${{ secrets.canary != '' }}
        run: echo "passed=$PASSED"
      - name: Search this runner's memory
        run: |
          cat > /tmp/search.py <<'PY'
          import re, subprocess
          needle = "T9CAN" + "ARY" + "-4f8a1c"
          pid = subprocess.check_output(["pgrep", "-f", "Runner.Worker"]).split()[0].decode()
          utf8 = utf16 = 0
          with open(f"/proc/{pid}/maps") as maps, open(f"/proc/{pid}/mem", "rb", 0) as mem:
              for line in maps:
                  m = re.match(r"([0-9a-f]+)-([0-9a-f]+) r", line)
                  if not m: continue
                  try:
                      mem.seek(int(m[1], 16)); data = mem.read(int(m[2], 16) - int(m[1], 16))
                  except (OSError, ValueError, OverflowError):
                      continue
                  utf8 += data.count(needle.encode()); utf16 += data.count(needle.encode("utf-16-le"))
          print(f"found: {utf8 + utf16}")
          PY
          sudo python3 /tmp/search.py
